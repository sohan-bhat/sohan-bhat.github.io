name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

      # Tells Bing, Yandex and the other IndexNow engines the site changed, so
      # they recrawl it soon. The key file is public/dc7828849bc47bc7731955a8327a394d.txt. Google
      # doesn't use IndexNow, and a failure here never fails the deploy.
      - name: Tell IndexNow the site changed
        continue-on-error: true
        run: |
          curl -sS -o /dev/null -w '%{http_code}\n' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{"host":"sohanbhat.me","key":"dc7828849bc47bc7731955a8327a394d","keyLocation":"https://sohanbhat.me/dc7828849bc47bc7731955a8327a394d.txt","urlList":["https://sohanbhat.me/","https://sohanbhat.me/lhd-paper.pdf"]}'
