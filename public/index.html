<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#13110f" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="15-year-old building ML research, agent tools and FRC robots."
    />
    <title>Sohan Bhat</title>
    <!-- The link preview in iMessage, Slack, X, Discord and email. The image
         is public/og-image.jpg at 1200 by 630, and it needs a full URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sohan-bhat.github.io/" />
    <meta property="og:title" content="Sohan Bhat" />
    <meta property="og:description" content="15-year-old building ML research, agent tools and FRC robots." />
    <meta property="og:image" content="https://sohan-bhat.github.io/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sohan Bhat beside his photo, with the line I build neural networks from scratch, web apps, and robots." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Excon and Erode, self-hosted and preloaded so they start
         downloading right away. scripts/fetch-fonts.js puts the files in
         public/fonts. -->
    <link rel="preload" href="%PUBLIC_URL%/fonts/excon-variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="%PUBLIC_URL%/fonts/erode-variable.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Excon';
        font-weight: 100 900;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/excon-variable.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Erode';
        font-weight: 300 700;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/erode-variable.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
