    <!-- New Computer Modern, the typeface of LaTeX documents, subset for the web (see /fonts). -->
    <style>
      @font-face {
        font-family: 'NewCM Web';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/ncm-web-book.woff2') format('woff2');
        ascent-override: 80.6%;
        descent-override: 19.4%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: 'NewCM Web';
        font-style: italic;
        font-weight: 400;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/ncm-web-book-italic.woff2') format('woff2');
        ascent-override: 80.6%;
        descent-override: 19.4%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: 'NewCM Web';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url('%PUBLIC_URL%/fonts/ncm-web-bold.woff2') format('woff2');
        ascent-override: 80.6%;
        descent-override: 19.4%;
        line-gap-override: 0%;
      }

      /* Georgia, scaled to match, so text doesn't reflow when the fonts load. */
      @font-face {
        font-family: 'NewCM Fallback';
        font-style: normal;
        font-weight: 400;
        src: local('Georgia');
        size-adjust: 99.7%;
        ascent-override: 80.6%;
        descent-override: 19.4%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: 'NewCM Fallback';
        font-style: italic;
        font-weight: 400;
        src: local('Georgia Italic'), local('Georgia-Italic');
        size-adjust: 99.7%;
        ascent-override: 80.6%;
        descent-override: 19.4%;
        line-gap-override: 0%;
      }

      @font-face {
        font-family: 'NewCM Fallback';
        font-style: normal;
        font-weight: 700;
        src: local('Georgia Bold'), local('Georgia-Bold');
        size-adjust: 100.2%;
        ascent-override: 80.6%;
        descent-override: 19.4%;
        line-gap-override: 0%;
      }
    </style>
